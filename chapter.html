<style>
  :root {
    --bg: #fff8ef; --ink: #2b2540; --muted: #6d6782; --card: #fff; --line: #2b2540;
    --pink: #ff7eb6; --pink-soft: #ffe0ee; --sun: #ffd23f; --sun-soft: #fff3c4;
    --phy: #4f8cff; --phy-soft: #e3edff; --chem: #ff7a59; --chem-soft: #ffe8e0;
    --earth: #20b07a; --earth-soft: #e4f9ef; --red: #e8364f;
    --shadow: 4px 4px 0 var(--line);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); line-height: 1.7;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    background-image: radial-gradient(#f1e3cf 1.2px, transparent 1.2px); background-size: 22px 22px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  a { color: inherit; }
  header { padding-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .back { text-decoration: none; font-weight: 700; background: var(--card); border: 2.5px solid var(--line); border-radius: 12px; padding: 6px 14px; box-shadow: 3px 3px 0 var(--line); }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; text-decoration: none; }
  .logo svg { width: 44px; height: 41px; }

  .title { margin-top: 22px; }
  .pill { display: inline-block; color: #fff; font-weight: 700; padding: 3px 14px; border-radius: 999px; border: 2px solid var(--line); transform: rotate(-2deg); background: var(--phy); }
  .pill.chem { background: var(--chem); } .pill.earth { background: var(--earth); }
  .title h1 { margin: 10px 0 4px; font-size: clamp(1.9rem, 5vw, 2.7rem); font-weight: 900; line-height: 1.25; text-wrap: balance; }
  .title p { margin: 0; color: var(--muted); font-size: 1.05rem; max-width: 46em; }

  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .toc a { text-decoration: none; font-weight: 700; font-size: .95rem; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 4px 14px; }
  .toc a:hover { background: var(--sun-soft); }
  .toc a .an { color: var(--pink); }

  section.sec { margin-top: 28px; background: var(--card); border: 3px solid var(--line); border-radius: 24px; box-shadow: 6px 6px 0 var(--line); padding: 20px; scroll-margin-top: 16px; }
  .sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .sec-h .no { font-weight: 900; color: #fff; background: var(--ink); border-radius: 10px; padding: 0 10px; font-size: 1.05rem; }
  .sec-h h2 { margin: 0; font-size: 1.45rem; font-weight: 900; }
  .sec-h .now { font-size: .8rem; font-weight: 900; background: var(--sun); border: 2px solid var(--line); border-radius: 8px; padding: 0 8px; }

  .points { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .points li { position: relative; padding-left: 22px; }
  .points li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 9px; height: 9px; border-radius: 50%; background: var(--pink); border: 2px solid var(--line); }
  b { font-weight: 900; }
  mark { background: linear-gradient(transparent 55%, #ffe27a 55%); color: inherit; padding: 0 2px; }
  .hot { color: var(--red); font-weight: 900; }
  a.xl { color: #2f6db5; font-weight: 700; text-decoration: none; border-bottom: 2px dotted #2f6db5; }

  .scroll { overflow-x: auto; margin-top: 14px; border: 2.5px solid var(--line); border-radius: 16px; background: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 10px; text-align: center; border-bottom: 1.5px solid #ece6da; vertical-align: middle; }
  th { background: var(--ink); color: #fff; font-weight: 700; white-space: nowrap; }
  td:first-child { font-weight: 900; background: #faf6ee; }
  tr:last-child td { border-bottom: 0; }

  .boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 14px; }
  .box { border: 2.5px solid var(--line); border-radius: 16px; padding: 10px 14px; }
  .box h4 { margin: 0 0 4px; font-size: .95rem; }
  .box p, .box ul { margin: 0; }
  .box ul { padding-left: 1.1em; }
  .box.k { background: var(--sun-soft); }
  .box.tip { background: var(--phy-soft); }
  .box.err { background: #ffe3e6; }
  .box.see { background: var(--earth-soft); }
  .box.see a { display: inline-block; margin: 2px 6px 2px 0; }
  /* 想一想：先想，再點開答案 */
  .think { margin-top: 14px; border: 2.5px dashed var(--line); border-radius: 16px; background: #fffaf0; }
  .think summary { cursor: pointer; list-style: none; padding: 10px 14px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .think summary::-webkit-details-marker { display: none; }
  .think .tk { background: var(--sun); border: 2px solid var(--line); border-radius: 8px; padding: 0 8px; font-size: .85rem; font-weight: 900; flex: none; }
  .think .open { margin-left: auto; font-size: .8rem; color: #2f6db5; font-weight: 900; flex: none; }
  .think[open] .open { display: none; }
  .think p { margin: 0; padding: 0 14px 12px; color: #2b2540; }

  .big { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; text-decoration: none; margin: 4px 0 14px; padding: 14px 18px; border: 2.5px solid var(--line); border-radius: 18px; background: var(--pink-soft); box-shadow: var(--shadow); font-weight: 700; }
  .big .ic { font-size: 2rem; }
  .big b { font-size: 1.15rem; display: block; }
  .big .go { margin-left: auto; background: var(--sun); border: 2px solid var(--line); border-radius: 10px; padding: 3px 14px; font-weight: 900; }
  .big:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--line); }

  /* 動畫元件外框（內容由 widgets.js 畫） */
  .wg { margin: 4px 0 16px; border: 2.5px solid var(--line); border-radius: 18px; background: #fbfdff; padding: 12px; }
  .wg-t { font-weight: 900; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .wg-t.st::before { content: "⏯ 一步一步"; background: var(--sun); color: var(--ink); }
  .wbtn:disabled { opacity: .4; cursor: default; }
  .wg-t::before { content: "▶ 動畫"; flex: none; white-space: nowrap; align-self: flex-start; margin-top: 3px; font-size: .75rem; background: var(--pink); color: #fff; border: 2px solid var(--line); border-radius: 8px; padding: 0 8px; }
  .wg canvas { display: block; width: 100%; border: 2px solid #d9e2f0; border-radius: 12px; background: #fff; touch-action: none; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; font-weight: 700; font-size: .95rem; }
  .ctl label { display: inline-flex; align-items: center; gap: 6px; }
  .ctl input[type=range] { width: 140px; accent-color: var(--phy); }
  .ctl select { font: inherit; padding: 3px 8px; border-radius: 10px; border: 2px solid var(--line); background: #fff; }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { font: inherit; font-weight: 700; border: 0; background: #fff; padding: 4px 12px; cursor: pointer; color: var(--ink); }
  .seg button + button { border-left: 2px solid var(--line); }
  .seg button.on { background: var(--sun); }
  .wbtn { font: inherit; font-weight: 900; cursor: pointer; border: 2px solid var(--line); border-radius: 12px; padding: 4px 14px; background: var(--sun); box-shadow: 2px 2px 0 var(--line); color: var(--ink); }
  .wbtn.ghost { background: #fff; }
  .read { margin-top: 10px; background: #fff; border: 2px dashed #b9b2c9; border-radius: 12px; padding: 8px 12px; font-size: .95rem; }
  .read b { color: var(--red); }

  /* 整合觀念 */
  .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .lk { background: var(--card); border: 2.5px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .lk h3 { margin: 0 0 4px; font-size: 1.1rem; }
  .lk p { margin: 0 0 6px; color: var(--muted); font-size: .93rem; }
  h2.blk { margin: 40px 0 12px; font-size: 1.55rem; font-weight: 900; }

  .sum { background: var(--sun); border: 3px solid var(--line); border-radius: 22px; box-shadow: 6px 6px 0 var(--line); padding: 16px 20px; }
  .sum ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-weight: 700; }

  .quiz { display: grid; gap: 12px; }
  .qcard { background: #fff; border: 2.5px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .qcard h4 { margin: 0 0 8px; font-size: 1.05rem; }
  .opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .opt { font: inherit; text-align: left; cursor: pointer; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); touch-action: manipulation; }
  .opt:hover:not(:disabled) { background: var(--sun-soft); }
  .opt.right { background: #c9f5e2; } .opt.wrong { background: #ffd6d6; } .opt:disabled { cursor: default; }
  .why { margin: 8px 0 0; font-size: .93rem; color: var(--muted); display: none; } .why.show { display: block; }
  .score { margin-top: 14px; background: var(--sun); border: 3px solid var(--line); border-radius: 18px; padding: 12px 16px; box-shadow: 6px 6px 0 var(--line); font-weight: 900; }

  .pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 36px; }
  .pager a { text-decoration: none; font-weight: 900; background: var(--card); border: 2.5px solid var(--line); border-radius: 14px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--line); }
  .pager a small { display: block; font-weight: 500; color: var(--muted); font-size: .8rem; }
  .empty { margin-top: 40px; background: #fff; border: 3px solid var(--line); border-radius: 20px; padding: 24px; text-align: center; }
  footer { margin: 48px 0 32px; text-align: center; color: var(--muted); font-size: .92rem; }
  footer .heart { color: var(--pink); }
  @media (max-width: 560px) {
    section.sec { padding: 14px; border-radius: 20px; }
    .opts { grid-template-columns: 1fr; }
    .ctl input[type=range] { width: 110px; }
  }
  button, .opt { -webkit-tap-highlight-color: transparent; }
  @media (prefers-reduced-motion: reduce) { .big { transition: none; } }
</style>

<script>
/* ===== 讀網址：chapter.html?c=8a-3 ===== */
const P = new URLSearchParams(location.search);
const CID = P.get('c') || '8a-4';
const [TERM, CHN] = CID.split('-');
const B = window.BOOK;
const term = B.terms.find(t => t.id === TERM);
const chap = term && term.chapters.find(c => String(c.n) === CHN);
const SUB = { phy: '物理', chem: '化學', earth: '地科' };
const $ = id => document.getElementById(id);

function load(src) {
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
}

/* 小標記：**粗體** ==螢光== !!紅字!! [[8a-4#s4-2|連結文字]] [[optics.html|連結]] */
function md(s) {
  return String(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/==(.+?)==/g, '<mark>$1</mark>')
    .replace(/!!(.+?)!!/g, '<span class="hot">$1</span>')
    .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (m, to, txt) => `<a class="xl" href="${href(to)}">${txt}</a>`);
}
function href(to) {
  if (/\.html/.test(to)) return to;
  const [c, h] = to.split('#');
  return `chapter.html?c=${c}${h ? '#' + h : ''}`;
}

function render() {
  const N = (window.NOTES || {})[CID];
  if (!chap) { $('main').innerHTML = '<div class="empty">找不到這一章，回 <a href="index.html">課本目錄</a> 看看。</div>'; return; }
  document.title = `${chap.title}｜${term.name}第 ${chap.n} 章重點｜小朵兒的理化教室`;
  const isNow = s => B.now.term === TERM && B.now.sec === s;
  let h = `<div class="title"><span class="pill ${chap.sub}">${term.name} · 第 ${chap.n} 章 · ${SUB[chap.sub]}</span>
    <h1>${chap.icon} ${chap.title}</h1><p>${N ? md(N.intro || '') : '這一章的重點還在整理中。'}</p></div>`;
  h += '<nav class="toc">' + chap.secs.map(s => {
    const mw = ((window.MORE || {})[CID] || {})[s[0]] || {};
    const an = (N && N.s[s[0]] && (N.s[s[0]].w || N.s[s[0]].big)) || mw.w ? ' <span class="an">▶</span>' : '';
    return `<a href="#s${s[0]}">${s[0]} ${s[1]}${an}</a>`;
  }).join('') + (N && N.quiz ? '<a href="#quiz">✏️ 小測驗</a>' : '') + '</nav>';

  for (const s of chap.secs) {
    const d0 = (N && N.s[s[0]]) || {}, mo = ((window.MORE || {})[CID] || {})[s[0]] || {};
    // 合併補充內容：動畫、重點接在後面，另外加「想一想」
    const d = Object.assign({}, d0, { w: [].concat(d0.w || [], mo.w || []), p: (d0.p || mo.p) ? [].concat(d0.p || [], mo.p || []) : null, q: mo.q });
    if (!d.w.length) d.w = null;
    h += `<section class="sec" id="s${s[0]}"><div class="sec-h"><span class="no">${s[0]}</span><h2>${s[1]}</h2>${isNow(s[0]) ? '<span class="now">正在學</span>' : ''}</div>`;
    if (d.big) h += `<a class="big" href="${d.big.href}"><span class="ic">${d.big.ic || '🔍'}</span><span><b>${d.big.t}</b>${d.big.d || ''}</span><span class="go">打開 ▶</span></a>`;
    for (const w of [].concat(d.w || [])) h += `<div class="wg" data-w="${w}"></div>`;
    if (d.p) h += '<ul class="points">' + d.p.map(x => `<li>${md(x)}</li>`).join('') + '</ul>';
    if (d.t) h += `<div class="scroll"><table><thead><tr>${d.t.h.map(x => `<th>${md(x)}</th>`).join('')}</tr></thead><tbody>` +
      d.t.r.map(r => '<tr>' + r.map(x => `<td>${md(x)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
    if (d.t2) h += `<div class="scroll"><table><thead><tr>${d.t2.h.map(x => `<th>${md(x)}</th>`).join('')}</tr></thead><tbody>` +
      d.t2.r.map(r => '<tr>' + r.map(x => `<td>${md(x)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
    const bx = [];
    if (d.k) bx.push(`<div class="box k"><h4>🔑 口訣／公式</h4><p>${md(d.k)}</p></div>`);
    if (d.tip) bx.push(`<div class="box tip"><h4>💡 小提醒</h4><p>${md(d.tip)}</p></div>`);
    if (d.err) bx.push(`<div class="box err"><h4>⚠️ 容易錯</h4><ul>${[].concat(d.err).map(x => `<li>${md(x)}</li>`).join('')}</ul></div>`);
    if (d.see) bx.push(`<div class="box see"><h4>🔗 一起看</h4><p>${d.see.map(([to, t]) => `<a class="xl" href="${href(to)}">${t}</a>`).join('')}</p></div>`);
    if (bx.length) h += '<div class="boxes">' + bx.join('') + '</div>';
    if (d.q) h += `<details class="think"><summary><span class="tk">💭 想一想</span>${md(d.q[0])}<span class="open">點我看答案</span></summary><p>👉 ${md(d.q[1])}</p></details>`;
    if (!d.p && !d.w && !d.big) h += '<p style="color:var(--muted)">這一節的重點還在整理中。</p>';
    h += '</section>';
  }

  if (N && N.link) {
    h += '<h2 class="blk">🧩 整合觀念</h2><div class="links">' + N.link.map(l =>
      `<div class="lk"><h3>${l.t}</h3><p>${md(l.d)}</p>${(l.to || []).map(([to, t]) => `<a class="xl" href="${href(to)}">${t}</a>`).join('　')}</div>`).join('') + '</div>';
  }
  if (N && N.sum) h += '<h2 class="blk">📌 這一章一定要會</h2><div class="sum"><ul>' + N.sum.map(x => `<li>${md(x)}</li>`).join('') + '</ul></div>';
  if (N && N.quiz) {
    h += '<h2 class="blk" id="quiz">✏️ 考考你</h2><div class="quiz">' + N.quiz.map((x, i) =>
      `<div class="qcard" data-i="${i}"><h4>${i + 1}. ${md(x.q)}</h4><div class="opts">${x.o.map((o, j) => `<button class="opt" data-j="${j}">${'ABCD'[j]}. ${md(o)}</button>`).join('')}</div><p class="why"></p></div>`).join('') +
      '</div><div class="score" id="score">得分：0 / 0</div>';
  }
  // 上一章、下一章
  const all = []; B.terms.forEach(t => t.chapters.forEach(c => all.push([t, c])));
  const k = all.findIndex(([t, c]) => t.id === TERM && c.n === chap.n);
  const pv = all[k - 1], nx = all[k + 1];
  h += '<nav class="pager">' + (pv ? `<a href="chapter.html?c=${pv[0].id}-${pv[1].n}"><small>← 上一章</small>${pv[0].name} ${pv[1].title}</a>` : '<span></span>') +
    (nx ? `<a href="chapter.html?c=${nx[0].id}-${nx[1].n}" style="text-align:right"><small>下一章 →</small>${nx[0].name} ${nx[1].title}</a>` : '') + '</nav>';
  $('main').innerHTML = h;

  // 小測驗
  if (N && N.quiz) {
    let ans = 0, ok = 0;
    $('main').querySelector('.quiz').addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      const card = b.closest('.qcard'), x = N.quiz[+card.dataset.i], j = +b.dataset.j;
      card.querySelectorAll('.opt').forEach((o, q) => { o.disabled = true; if (q === x.a) o.classList.add('right'); });
      if (j !== x.a) b.classList.add('wrong'); else ok++;
      ans++;
      const why = card.querySelector('.why'); why.innerHTML = (j === x.a ? '✅ 答對了！ ' : '❌ 再想想～ ') + md(x.why); why.classList.add('show');
      $('score').textContent = `得分：${ok} / ${ans}` + (ans === N.quiz.length ? (ok === ans ? '　🎉 全對！' : '　💪 錯的回去看一下重點就會了') : '');
    });
  }
  // 動畫
  document.querySelectorAll('.wg').forEach(el => {
    const f = (window.WIDGETS || {})[el.dataset.w];
    if (f) { try { f(el); } catch (err) { el.textContent = '動畫載入失敗：' + err.message; } }
    else el.remove();
  });
  if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
}

Promise.all([
  load(`data/${TERM}.js?v=4`).catch(() => {}),
  load('data/more.js?v=2').catch(() => {}),
  load('widgets.js?v=2').then(() => Promise.all([load('widgets-2.js?v=1'), load('widgets-3.js?v=1'), load('widgets-4.js?v=1')])).catch(() => {}),
]).then(render);
</script>
<script src="share.js?v=4"></script>
</body>
