<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小朵兒的理化教室</title>
<!-- 分享到 FB / LINE 的預覽卡片。縮圖原稿在 og/，改圖後把 ?v= 加 1 -->
<meta name="description" content="國中理化互動教材：拖拉動畫看懂成像、常考表格、小測驗，一起把理化變成好玩的事！">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:site_name" content="小朵兒的理化教室">
<meta property="og:title" content="小朵兒的理化教室">
<meta property="og:description" content="國中理化互動教材：拖拉動畫看懂成像、常考表格、小測驗，一起把理化變成好玩的事！">
<meta property="og:url" content="https://joption-tw.github.io/xiaoduoer-science/">
<meta property="og:image" content="https://joption-tw.github.io/xiaoduoer-science/og/home.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="小朵兒的理化教室：可愛的大鳳蝶和標題">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 版面：大封面（名字 + 大鳳蝶）→ 課本目錄（資料在 curriculum.js）→ 今日小知識。貼紙感，可愛版大鳳蝶是小朵兒的記號 */
  :root {
    --bg: #fff8ef;
    --ink: #2b2540;
    --muted: #6d6782;
    --card: #ffffff;
    --line: #2b2540;
    --pink: #ff7eb6;
    --pink-soft: #ffe0ee;
    --phy: #4f8cff;
    --phy-soft: #e3edff;
    --chem: #ff7a59;
    --chem-soft: #ffe8e0;
    --sun: #ffd23f;
    --mint: #3ccf9e;
    --mint-soft: #e4f9ef;
    --shadow: 4px 4px 0 var(--line);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
    background-image: radial-gradient(#f1e3cf 1.2px, transparent 1.2px);
    background-size: 22px 22px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  /* 頂部 */
  header { padding: 20px 0 0; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.2rem; }
  .logo svg { width: 50px; height: 47px; flex: none; }
  .nav small { color: var(--muted); font-weight: 500; }

  /* 封面 */
  .hero {
    margin-top: 24px; position: relative; overflow: hidden;
    background: var(--card); border: 3px solid var(--line); border-radius: 28px;
    box-shadow: 6px 6px 0 var(--line);
    padding: 40px 36px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 24px; align-items: center;
  }
  .hero::before {
    content: ""; position: absolute; right: -90px; top: -90px; width: 300px; height: 300px; border-radius: 50%;
    background: var(--pink-soft); z-index: 0;
  }
  .hero > * { position: relative; z-index: 1; }
  .hello {
    display: inline-flex; align-items: center; gap: 6px; background: var(--pink); color: #fff; font-weight: 900;
    padding: 4px 16px; border-radius: 999px; border: 2px solid var(--line); font-size: 1rem;
    transform: rotate(-2deg); box-shadow: 2px 2px 0 var(--line);
  }
  .hero h1 { font-size: clamp(2.1rem, 5.2vw, 3.4rem); line-height: 1.2; margin: 16px 0 14px; font-weight: 900; text-wrap: balance; }
  .hero h1 .hl { background: linear-gradient(transparent 58%, var(--sun) 58%); padding: 0 4px; }
  .hero h1 .nick { color: var(--pink); -webkit-text-stroke: 1.5px var(--line); paint-order: stroke fill; }
  .nameplate {
    display: inline-flex; align-items: stretch; margin: 0 0 18px; border: 2.5px solid var(--line);
    border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); background: var(--card);
  }
  .nameplate span { padding: 6px 12px; font-weight: 700; }
  .nameplate .k { background: var(--ink); color: #fff; font-size: .85rem; display: grid; place-items: center; letter-spacing: .1em; }
  .nameplate .v { font-size: 1.25rem; font-weight: 900; letter-spacing: .15em; }
  .hero p { color: var(--muted); font-size: 1.08rem; margin: 0 0 22px; max-width: 30em; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 1.02rem; color: var(--ink);
    background: var(--sun); border: 2.5px solid var(--line); border-radius: 14px;
    padding: 10px 20px; box-shadow: var(--shadow); text-decoration: none;
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--line); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }
  .btn:focus-visible, .chip:focus-visible, .card:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

  /* 右側：照片 + 大鳳蝶 */
  .hero-art { position: relative; height: 340px; display: grid; place-items: center; }
  .polaroid {
    margin: 0; background: #fff; border: 3px solid var(--line); border-radius: 10px;
    box-shadow: 6px 6px 0 var(--line); padding: 12px 12px 6px; width: 220px; transform: rotate(3deg);
    position: relative; z-index: 1;
  }
  .polaroid::before {
    content: ""; position: absolute; top: -14px; left: 50%; width: 80px; height: 26px;
    transform: translateX(-50%) rotate(-4deg); background: rgba(255, 126, 182, .75);
    border: 2px solid var(--line); border-radius: 4px;
  }
  .photo {
    aspect-ratio: 1; max-width: 100%; border: 2px solid var(--line); border-radius: 6px; overflow: hidden;
    background: repeating-linear-gradient(45deg, var(--pink-soft) 0 12px, #fff3f8 12px 24px);
    position: relative; display: grid; place-items: center;
  }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo-empty { text-align: center; color: var(--muted); font-weight: 700; font-size: .95rem; line-height: 1.8; }
  .photo-empty b { display: block; font-size: 2rem; }
  .polaroid figcaption { text-align: center; font-weight: 900; padding: 8px 0 4px; }
  .polaroid figcaption small { display: block; font-weight: 500; color: var(--muted); font-size: .8rem; margin-top: -2px; }
  .sticker { position: absolute; z-index: 2; animation: float 4.5s ease-in-out infinite; }
  .sticker svg { display: block; width: 100%; height: 100%; filter: drop-shadow(3px 3px 0 rgba(43,37,64,.35)); }
  .s1 { width: 150px; height: 140px; left: -4%; top: 0; --tilt: -14deg; }
  .s2 { width: 72px; height: 68px; right: 0; top: 34%; animation-delay: -1.5s; --tilt: 16deg; }
  .s3 { width: 54px; height: 50px; left: 12%; bottom: 2%; animation-delay: -3s; --tilt: -6deg; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(var(--tilt, 0deg)); } 50% { transform: translateY(-12px) rotate(calc(var(--tilt, 0deg) + 6deg)); } }
  /* 大鳳蝶拍翅膀：只有翅膀左右收合，身體不動 */
  .bf .wing { transform-box: view-box; transform-origin: 60px 56px; animation: flap .8s ease-in-out infinite alternate; }
  .s2 .wing { animation-duration: .65s; animation-delay: -.3s; }
  .s3 .wing { animation-duration: .55s; animation-delay: -.5s; }
  .logo .wing { animation-duration: 1.6s; }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.5); } }
  .trail { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* 區塊 */
  section { margin-top: 48px; }
  .sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .sec-head h2 { margin: 0; font-size: 1.6rem; font-weight: 900; }
  .sec-head h2 span { font-size: 1rem; color: var(--muted); font-weight: 500; margin-left: 6px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font: inherit; font-weight: 700; cursor: pointer; padding: 6px 16px; border-radius: 999px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }
  .chip.on { background: var(--ink); color: #fff; }

  /* 課本目錄：學期分頁 → 現在學到 → 每一章一張卡，節列在卡片裡 */
  :root { --earth: #20b07a; --earth-soft: #e4f9ef; }
  .now-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; text-decoration: none; color: var(--ink);
    background: var(--sun); border: 2.5px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
    padding: 12px 18px; margin-bottom: 10px; font-weight: 700; transition: transform .12s, box-shadow .12s;
  }
  a.now-bar:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--line); }
  .now-bar .pin { font-size: 1.4rem; flex: none; }
  .now-bar .txt { flex: 1 1 220px; min-width: 0; }
  .now-bar b { font-size: 1.15rem; font-weight: 900; }
  .now-bar .go { margin-left: auto; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 2px 12px; font-weight: 900; }
  .book-note { margin: 0 0 18px; color: var(--muted); font-size: .9rem; }
  .chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .chap { background: var(--card); border: 2.5px solid var(--line); border-radius: 20px; padding: 16px 16px 12px; box-shadow: var(--shadow); min-width: 0; }
  .chap-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .chap .icon { width: 48px; height: 48px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 1.6rem; border: 2px solid var(--line); }
  .chap.phy .icon { background: var(--phy-soft); } .chap.chem .icon { background: var(--chem-soft); } .chap.earth .icon { background: var(--earth-soft); }
  .chap-head small { display: block; color: var(--muted); font-weight: 700; font-size: .8rem; letter-spacing: .05em; }
  .chap-head h3 { margin: 0; font-size: 1.15rem; line-height: 1.3; text-wrap: balance; }
  .chap .tag { margin-left: auto; align-self: start; font-size: .75rem; font-weight: 700; color: #fff; padding: 1px 9px; border-radius: 999px; border: 2px solid var(--line); flex: none; }
  .chap.phy .tag { background: var(--phy); } .chap.chem .tag { background: var(--chem); } .chap.earth .tag { background: var(--earth); }
  .secs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .sec { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; color: var(--ink); text-decoration: none; border: 2px solid transparent; }
  .sec .num { font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 2.2em; }
  .sec .nm { flex: 1; min-width: 0; }
  .sec .badge { flex: none; font-size: .76rem; font-weight: 900; border-radius: 8px; padding: 1px 8px; border: 2px solid var(--line); }
  a.sec { background: #fff; border-color: #ebe5f2; }
  a.sec:hover { background: var(--sun-soft, #fff3c4); border-color: var(--line); }
  a.sec.anim { background: var(--pink-soft); border-color: var(--line); font-weight: 700; }
  a.sec.anim:hover { background: #ffd0e6; }
  a.sec .badge { background: var(--mint); color: #fff; }
  a.sec .badge.note { background: #fff; color: var(--muted); border-color: #d8d2e4; font-weight: 700; }
  a.chap-head { text-decoration: none; color: inherit; border-radius: 14px; }
  a.chap-head:hover h3 { text-decoration: underline; text-decoration-thickness: 3px; text-decoration-color: var(--sun); }
  .sec.now { box-shadow: 0 0 0 3px var(--sun); }
  .sec .badge.nowb { background: var(--sun); color: var(--ink); }
  .sec:not(a) .nm { color: #4a4560; }

  /* 今日小知識 */
  .fact {
    background: var(--sun); border: 3px solid var(--line); border-radius: 24px; box-shadow: 6px 6px 0 var(--line);
    padding: 26px 28px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  }
  .fact-emoji { font-size: 3rem; }
  .fact-body { flex: 1; min-width: 220px; }
  .fact-body b { display: block; font-size: .95rem; letter-spacing: .1em; }
  .fact-body p { margin: 4px 0 0; font-size: 1.2rem; font-weight: 700; }
  .fact .btn { background: #fff; }

  footer { margin: 56px 0 32px; text-align: center; color: var(--muted); font-size: .92rem; }
  footer .heart { color: var(--pink); }

  @media (max-width: 720px) {
    .hero { grid-template-columns: 1fr; padding: 28px 20px; }
    .hero-art { height: 300px; }
    .polaroid { width: 200px; }
    .s1 { width: 96px; height: 90px; } .s2 { width: 56px; height: 52px; } .s3 { width: 44px; height: 41px; }
    .nav small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sticker, .bf .wing { animation: none; }
    .btn, .card { transition: none; }
  }
</style>
</head>
<body>
  <!-- 可愛版大鳳蝶：深藍黑翅膀、前翅基部紅斑、後翅白斑和尾突，是小朵兒的記號。
       翅膀和身體分開，翅膀可以單獨拍動 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="bf-half" stroke="#2b2540" stroke-width="3" stroke-linejoin="round">
        <!-- 後翅（含尾突） -->
        <path d="M57 54 C44 54 24 58 20 72 C17 83 26 92 35 90 C36 98 38 106 44 106 C49 105 48 96 46 89 C54 84 58 70 57 54 Z" fill="#36315c"/>
        <path d="M53 61 C45 59 33 63 30 71 C29 79 39 82 46 78 C52 74 55 68 53 61 Z" fill="#fff6fb" stroke="none"/>
        <circle cx="38" cy="72" r="3.4" fill="#ff7eb6" stroke="none"/>
        <circle cx="46" cy="69" r="2.4" fill="#ff7eb6" stroke="none"/>
        <circle cx="25" cy="82" r="2.3" fill="#ff5c7c" stroke="none"/>
        <circle cx="33" cy="87" r="2" fill="#ff5c7c" stroke="none"/>
        <circle cx="44" cy="101" r="2.2" fill="#ffd23f" stroke="none"/>
        <!-- 前翅 -->
        <path d="M57 47 C50 26 30 6 12 9 C3 11 2 24 7 34 C13 46 34 54 57 52 Z" fill="#36315c"/>
        <g stroke="#5d5890" stroke-width="1.6" fill="none" stroke-linecap="round">
          <path d="M52 45 L17 16"/><path d="M52 47 L9 29"/><path d="M53 49 L14 41"/>
        </g>
        <ellipse cx="48" cy="46" rx="8.5" ry="4.6" transform="rotate(22 48 46)" fill="#ff5c7c" stroke="none"/>
        <g fill="#fff" stroke="none"><circle cx="13" cy="15" r="1.9"/><circle cx="7.5" cy="24" r="1.9"/><circle cx="9" cy="33" r="1.9"/></g>
      </g>
      <symbol id="bf-wings" viewBox="0 0 120 112">
        <use href="#bf-half"/>
        <use href="#bf-half" transform="matrix(-1 0 0 1 120 0)"/>
      </symbol>
      <symbol id="bf-body" viewBox="0 0 120 112">
        <g fill="none" stroke="#2b2540" stroke-width="2.6" stroke-linecap="round">
          <path d="M55 28 C52 17 46 11 40 11"/><path d="M65 28 C68 17 74 11 80 11"/>
        </g>
        <circle cx="39" cy="11" r="4.2" fill="#ff7eb6" stroke="#2b2540" stroke-width="2"/>
        <circle cx="81" cy="11" r="4.2" fill="#ff7eb6" stroke="#2b2540" stroke-width="2"/>
        <ellipse cx="60" cy="68" rx="7" ry="24" fill="#3a3354" stroke="#2b2540" stroke-width="3"/>
        <g stroke="#ff7eb6" stroke-width="2" stroke-linecap="round"><path d="M56 70 H64"/><path d="M56.5 78 H63.5"/><path d="M57.5 86 H62.5"/></g>
        <circle cx="60" cy="39" r="13.5" fill="#3a3354" stroke="#2b2540" stroke-width="3"/>
        <ellipse cx="54.5" cy="38" rx="4.4" ry="5" fill="#fff"/><ellipse cx="65.5" cy="38" rx="4.4" ry="5" fill="#fff"/>
        <circle cx="55.2" cy="39" r="2.7" fill="#2b2540"/><circle cx="66.2" cy="39" r="2.7" fill="#2b2540"/>
        <circle cx="56.2" cy="37.6" r="1.1" fill="#fff"/><circle cx="67.2" cy="37.6" r="1.1" fill="#fff"/>
        <ellipse cx="50.5" cy="45" rx="3.2" ry="1.9" fill="#ff7eb6"/><ellipse cx="69.5" cy="45" rx="3.2" ry="1.9" fill="#ff7eb6"/>
        <path d="M57 45.5 Q60 48.5 63 45.5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="wrap">
    <header>
      <div class="nav">
        <div class="logo"><svg class="bf" viewBox="0 0 120 112" aria-hidden="true"><use class="wing" href="#bf-wings"/><use href="#bf-body"/></svg>小朵兒的理化教室</div>
        <small>爸爸做給小朵兒的專屬教材</small>
      </div>
      <div data-share data-compact></div>

      <div class="hero">
        <div>
          <span class="hello">🦋 嗨，小朵兒</span>
          <h1><span class="nick">小朵兒</span>，<br>一起把<span class="hl">理化</span><br>變成好玩的事！</h1>
          <div class="nameplate"><span class="k">專屬</span><span class="v">小朵兒</span></div>
          <p>從生活裡的小現象出發，一步一步看懂物理和化學。不懂的地方，隨時回來複習就好。</p>
          <a class="btn" href="#units">開始學習 →</a>
        </div>
        <div class="hero-art">
          <figure class="polaroid">
            <div class="photo">
              <img src="photo.jpg" alt="小朵兒的照片" onerror="this.remove()">
              <div class="photo-empty"><b>📷</b>小朵兒的照片<br>放這裡</div>
            </div>
            <figcaption>小朵兒 ✨<small>未來的小科學家</small></figcaption>
          </figure>
          <!-- 大鳳蝶飛過留下的虛線 -->
          <svg class="trail" viewBox="0 0 300 340" preserveAspectRatio="none" aria-hidden="true">
            <path d="M40 330 C10 260 120 250 90 190 C60 130 -10 150 30 90" fill="none" stroke="#ff7eb6" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
          </svg>
          <div class="sticker s1" aria-hidden="true"><svg class="bf" viewBox="0 0 120 112"><use class="wing" href="#bf-wings"/><use href="#bf-body"/></svg></div>
          <div class="sticker s2" aria-hidden="true"><svg class="bf" viewBox="0 0 120 112"><use class="wing" href="#bf-wings"/><use href="#bf-body"/></svg></div>
          <div class="sticker s3" aria-hidden="true"><svg class="bf" viewBox="0 0 120 112"><use class="wing" href="#bf-wings"/><use href="#bf-body"/></svg></div>
        </div>
      </div>
    </header>

    <main>
      <section id="units">
        <div class="sec-head">
          <h2>課本目錄<span>點任何一節看重點，有 ▶ 的還有動畫</span></h2>
          <div class="filters" id="terms" role="tablist" aria-label="選擇學期"></div>
        </div>
        <a class="now-bar" id="nowBar" hidden></a>
        <p class="book-note" id="bookNote"></p>
        <div class="chapters" id="chapters"></div>
      </section>

      <section>
        <div class="fact">
          <div class="fact-emoji">💡</div>
          <div class="fact-body">
            <b>小朵兒的今日小知識</b>
            <p id="fact-text">打雷時先看到閃電、才聽到雷聲，因為光比聲音快得多！</p>
          </div>
          <button class="btn" id="fact-btn">再來一個 🎲</button>
        </div>
      </section>
    </main>

    <footer>做給最親愛的小朵兒 <span class="heart">♥</span> 有問題隨時問爸爸</footer>
  </div>

<script src="curriculum.js?v=4"></script>
<script>
  // 課本目錄（資料在 curriculum.js）
  (function () {
    const B = window.BOOK; if (!B) return;
    const SUB = { phy: '物理', chem: '化學', earth: '地科' };
    const KEY = 'xde-term';
    let cur = B.now.term;
    try { const t = localStorage.getItem(KEY); if (B.terms.some(x => x.id === t)) cur = t; } catch (e) {}

    // 每一節連到章節重點頁（第 3 格有網址就用那個）
    const secHref = (t, c, x) => x[2] || `chapter.html?c=${t.id}-${c.n}#s${x[0]}`;
    const hasAnim = (t, c, x) => ((B.anim || {})[`${t.id}-${c.n}`] || []).includes(x[0]);

    // 現在學到哪裡
    const nt = B.terms.find(t => t.id === B.now.term);
    let nowSec = null, nowChap = null;
    if (nt) for (const c of nt.chapters) for (const x of c.secs) if (x[0] === B.now.sec) { nowSec = x; nowChap = c; }
    const bar = document.getElementById('nowBar');
    if (nowSec) {
      bar.hidden = false;
      bar.innerHTML = `<span class="pin">📍</span><span class="txt">現在學到：${nt.name} 第 ${nowChap.n} 章　<b>${nowSec[0]} ${nowSec[1]}</b></span>` +
        '<span class="go">去看重點和動畫 ▶</span>';
      bar.href = secHref(nt, nowChap, nowSec);
    }
    document.getElementById('bookNote').textContent =
      `章節依小朵兒用的${B.version}課本排列。`;

    function render() {
      document.getElementById('terms').innerHTML = B.terms.map(t =>
        `<button class="chip${t.id === cur ? ' on' : ''}" role="tab" aria-selected="${t.id === cur}" data-t="${t.id}" title="${t.full}">${t.name}</button>`).join('');
      const term = B.terms.find(t => t.id === cur);
      document.getElementById('chapters').innerHTML = term.chapters.map(c => {
        const rows = c.secs.map(x => {
          const isNow = term.id === B.now.term && x[0] === B.now.sec;
          const nowB = isNow ? '<span class="badge nowb">正在學</span>' : '';
          const an = hasAnim(term, c, x);
          return `<li><a class="sec${an ? ' anim' : ''}${isNow ? ' now' : ''}" href="${secHref(term, c, x)}"><span class="num">${x[0]}</span><span class="nm">${x[1]}</span>${nowB}` +
            (an ? '<span class="badge">▶ 動畫</span>' : '<span class="badge note">📒 重點</span>') + '</a></li>';
        }).join('');
        return `<article class="chap ${c.sub}"><a class="chap-head" href="chapter.html?c=${term.id}-${c.n}"><div class="icon" aria-hidden="true">${c.icon}</div>` +
          `<div><small>第 ${c.n} 章 · 整章重點 ›</small><h3>${c.title}</h3></div><span class="tag">${SUB[c.sub]}</span></a><ul class="secs">${rows}</ul></article>`;
      }).join('');
    }
    document.getElementById('terms').addEventListener('click', e => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      cur = b.dataset.t; try { localStorage.setItem(KEY, cur); } catch (err) {}
      render();
    });
    render();
  })();

  // 今日小知識
  const facts = [
    '打雷時先看到閃電、才聽到雷聲，因為光比聲音快得多！',
    '太陽光跑到地球大約要 8 分 20 秒。',
    '聲音在空氣中每秒約跑 340 公尺，在水裡快了 4 倍多。',
    '水在 4°C 時密度最大，所以湖面結冰了，底下的魚還能活。',
    '鑽石和鉛筆芯（石墨）都是由碳原子組成的！',
    '空氣裡大約 78% 是氮氣，氧氣只佔約 21%。',
    'pH 7 是中性，檸檬汁大約 pH 2，是酸性的喔。',
    '鐵生鏽是一種很慢的氧化反應。',
    '花朵的顏色來自花瓣裡的色素，有些色素遇到酸鹼還會變色！'
  ];
  let idx = 0;
  document.getElementById('fact-btn').addEventListener('click', () => {
    let n;
    do { n = Math.floor(Math.random() * facts.length); } while (n === idx);
    idx = n;
    document.getElementById('fact-text').textContent = facts[n];
  });
</script>
